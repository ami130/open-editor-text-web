name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — package.json's `packageManager` field is
      # the single source of truth. pnpm/action-setup@v4 ERRORS when both are
      # set, and this workflow additionally pinned 11 while package.json pins
      # 9.15.0, so even the intended versions disagreed.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (static, all routes prerendered)
        run: pnpm build

      - name: Install Playwright Chromium (axe gate runner)
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility gate — axe WCAG 2.0 A/AA on all routes
        run: node scripts/axe-check.mjs
